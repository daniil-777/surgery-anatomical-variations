# GitHub Pages hosts only the sign-in gateway. Studio assets are served exclusively
# by the authenticated HTTPS server; rebuilding the public app here would bypass login.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify gateway outage and recovery behavior
        run: node --test tests/browser-cloud-gateway.test.mjs
      - name: Build sign-in gateway only
        env:
          VISCERA_STUDIO_ORIGIN: ${{ vars.VISCERA_STUDIO_ORIGIN }}
        run: python3 scripts/build_login_gateway.py --out login-gateway --origin "$VISCERA_STUDIO_ORIGIN"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: login-gateway
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
