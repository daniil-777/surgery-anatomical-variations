# Fly.io alternative (needs `fly auth login`): from the staged tree, `fly launch --copy-config --no-deploy` then
# `fly deploy`. 4 GB RAM holds torch, the joint model and the 0.5B text adapter; the demo database is ephemeral.
app = "viscera-studio"
primary_region = "ams"
[build]
  dockerfile = "Dockerfile"
[env]
  PORT = "7860"
[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
[[vm]]
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 2
