<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>Your VISCERA verification code</title>
<style>
  @media (prefers-color-scheme: dark) {
    .px-mail-page { background: #000000 !important; }
    .px-mail-card { background: #1c1c1e !important; }
    .px-mail-title, .px-mail-code { color: #f5f5f7 !important; }
    .px-mail-text, .px-mail-note, .px-mail-brand { color: #a1a1a6 !important; }
    .px-mail-code { background: #2c2c2e !important; }
  }
</style>
</head>
<body class="px-mail-page" style="margin:0;padding:0;background:#f5f5f7;">
<table role="presentation" class="px-mail-page" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f5f5f7;">
<tr><td align="center" style="padding:48px 16px;">
<table role="presentation" class="px-mail-card" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;background:#ffffff;border-radius:18px;">
<tr><td style="padding:40px 36px 36px;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif;">
<p class="px-mail-brand" style="margin:0 0 28px;font-size:13px;line-height:1.2;font-weight:600;letter-spacing:0.12em;color:#6e6e73;">VISCERA</p>
<h1 class="px-mail-title" style="margin:0 0 12px;font-size:24px;line-height:1.25;font-weight:600;color:#1d1d1f;">Confirm it&rsquo;s you</h1>
<p class="px-mail-text" style="margin:0 0 28px;font-size:15px;line-height:1.5;color:#424245;">Enter this code in VISCERA to confirm the change to your account.</p>
<p class="px-mail-code" style="margin:0 0 28px;padding:18px 0;border-radius:12px;background:#f5f5f7;text-align:center;font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace;font-size:32px;line-height:1.2;font-weight:600;letter-spacing:0.25em;color:#1d1d1f;">{{ .Token }}</p>
<p class="px-mail-note" style="margin:0;font-size:12px;line-height:1.5;color:#6e6e73;">The code expires in one hour. If you didn&rsquo;t ask for this code, someone may know your password: sign in to VISCERA and change it.</p>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
